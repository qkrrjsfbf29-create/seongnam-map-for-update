name: Update public store data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 1 * *"

concurrency:
  group: public-store-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stores:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest store data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          MAX_GEOCODE_PER_RUN: "500"
        run: |
          test -n "$DATA_GO_KR_API_KEY"
          test -n "$KAKAO_REST_API_KEY"
          test -f stores.json
          python scripts/update_stores.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Seongnam child allowance store data"
          file_pattern: stores.json stores.csv
